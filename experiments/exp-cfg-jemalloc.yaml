experiment_id: exp-cfg-jemalloc
hypothesis: >-
  jemalloc defaults to round-robin arenas and inline purging.
  percpu_arena:percpu binds arenas to CPUs (less cross-thread contention between
  tokio and rayon workers) and background_thread:true moves dirty-page purging
  off request threads. Set through _RJEM_MALLOC_CONF (tikv-jemalloc's prefixed
  symbols).
parent: exp-cfg-control
phase: system
track: system
git_ref: main
local_ref: d7c8d5c1c6  # branch perf/eth-call-rayon-io (champion)
profiling: false
families: [c8a, c8i, c8g, m9g]
runtime_env:
  # Prefixed name for the _rjem_ build seen in profiles; MALLOC_CONF covers an unprefixed one.
  _RJEM_MALLOC_CONF: "percpu_arena:percpu,background_thread:true"
  MALLOC_CONF: "percpu_arena:percpu,background_thread:true"
