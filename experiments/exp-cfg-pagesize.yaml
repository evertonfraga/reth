experiment_id: exp-cfg-pagesize
hypothesis: >-
  Heavy calls are dominated by 10k MDBX B-tree seeks (node_search/cmp_lexical
  ~19%). A 16KB page holds 4x the keys of the default 4KB page, so the
  HashedStorages tree is shallower. The datadir is recreated from genesis each
  run, so the creation-time page size can vary per experiment.
parent: exp-cfg-control
phase: system
track: system
git_ref: main
local_ref: d7c8d5c1c6  # branch perf/eth-call-rayon-io (champion)
profiling: false
families: [c8a, c8i, c8g, m9g]
runtime_env:
  RETH_EXTRA_ARGS: "--db.page-size=16KB"
