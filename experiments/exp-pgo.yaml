experiment_id: exp-pgo
hypothesis: >-
  Untried rung: profile-guided optimization. The workload is branchy and
  dispatch-heavy (EVM opcode dispatch, MDBX B-tree comparisons, jsonrpsee
  routing), the kind of code where PGO's block layout and inlining decisions pay
  off. build-pgo.sh instruments, trains on the same light+heavy eth_call mix,
  merges the profiles and rebuilds with -Cprofile-use, keeping the family's
  target-cpu in both passes. Expect 3-10%.
phase: compiler
track: compiler
parent: exp-cfg-control
git_ref: main
local_ref: d7c8d5c1c6  # branch perf/eth-call-rayon-io (champion)
build_script: build-pgo.sh
# Two full builds plus a training run.
build_timeout_min: 90
profiling: false
# x86_64 is excluded: instrumenting the reth crate crashes rustc's LLVM 23.1
# (SIGILL inside libLLVM during codegen), which no flag of ours can work around.
families: [m9g]
