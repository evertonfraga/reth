experiment_id: exp-native
hypothesis: >-
  Everything native on each box: Rust -C target-cpu=native (Zen 5 on c8a,
  Granite Rapids on c8i, the SHA3/crypto extensions on c8g that neoverse-v2
  omits; also flips reth-mdbx-sys to -march=native, build.rs:46) plus native
  CFLAGS for the remaining C dependencies. Upper bound of what per-CPU codegen
  buys on this workload, to compare with exp-native-cflags and exp-c8g-sha3-flag.
phase: compiler
track: compiler
parent: exp-native-cflags
git_ref: main
local_ref: d7c8d5c1c6  # branch perf/eth-call-rayon-io (champion)
# Appended after the family's target-cpu; rustc uses the last one.
build_flags: "-C target-cpu=native"
env:
  CFLAGS_x86_64_unknown_linux_gnu: "-march=native"
  CFLAGS_aarch64_unknown_linux_gnu: "-mcpu=native"
profiling: false
families: [c8a, c8i, c8g]
