experiment_id: exp-nightly-tco
hypothesis: >-
  evm2's build.rs picks its interpreter dispatch backend at build time:
  explicit-tail-call (tco) on a nightly rustc, otherwise the packed backend
  (crates/evm2/build.rs DispatchBackend::resolve). build.sh uses stable, so the
  node runs the packed dispatcher. A nightly toolchain switches it to tco, which
  turns the opcode dispatch loop into tail calls. Expect a small heavy-phase gain;
  the toolchain change also moves codegen, so a nightly control is needed if it wins.
phase: compiler
track: compiler
parent: exp-cfg-control
git_ref: main
local_ref: d7c8d5c1c6  # branch perf/eth-call-rayon-io (champion)
build_script: build-nightly.sh
build_timeout_min: 90
profiling: false
families: [m9g, m8azn-3xl]
