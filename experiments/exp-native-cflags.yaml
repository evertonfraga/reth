experiment_id: exp-native-cflags
hypothesis: >-
  The cc crate never passes target-cpu to C, so libmdbx (reth-mdbx-sys
  build.rs:15-49) and jemalloc are built for baseline x86-64 / armv8-a on every
  box; on Graviton4 that means outline-atomic helper calls instead of inline LSE
  in MDBX read transactions and jemalloc arenas. Building C dependencies with
  -march/-mcpu=native (build box = bench box) targets each CPU. Expect most on
  c8g; Rust codegen unchanged.
phase: compiler
track: compiler
parent: exp-rayon-io
git_ref: main
local_ref: d7c8d5c1c6  # branch perf/eth-call-rayon-io (champion)
env:
  CFLAGS_x86_64_unknown_linux_gnu: "-march=native"
  CFLAGS_aarch64_unknown_linux_gnu: "-mcpu=native"
profiling: false
families: [c8a, c8i, c8g]
