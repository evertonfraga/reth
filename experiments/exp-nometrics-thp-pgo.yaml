experiment_id: exp-nometrics-thp-pgo
hypothesis: >-
  Third lever on the stack. --db.disable-metrics measured -2.1% on m9g earlier
  tonight but with overlapping ranges, so it was unconfirmed; THP has since shown
  that a system lever can stack cleanly on PGO. If the metrics-registry lookups
  per database operation are a real cost, removing them on top of THP+PGO should
  land another ~2%, and the stack would be PGO + THP + flag.
phase: system
track: system
parent: exp-thp-pgo
git_ref: main
local_ref: d7c8d5c1c6  # branch perf/eth-call-rayon-io (champion code)
build_script: build-pgo.sh
build_timeout_min: 90
env:
  AUTOPERF_THP: always
runtime_env:
  RETH_EXTRA_ARGS: "--db.disable-metrics"
profiling: false
families: [m9g]
