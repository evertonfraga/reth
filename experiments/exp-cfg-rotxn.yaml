experiment_id: exp-cfg-rotxn
hypothesis: >-
  Every eth_call opens an MDBX read transaction that the read-tx-timeout manager
  tracks (DashMap insert/remove and an is_timed_out check under the txn mutex,
  visible in the light profile). --db.read-transaction-timeout=0 disables the
  timeout, removing that bookkeeping.
